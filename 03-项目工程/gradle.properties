org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 工程放在工作区的中文目录下（03-项目工程），AGP 默认会因为路径含非 ASCII 字符直接中止。
# 这个检查本身只是启发式警告（b.android.com/95744），关掉后需要用一次完整构建验证
# 全链路（aapt2 / d8 / kotlinc / CMake+NDK / zipalign / apksigner）在 UTF-8 路径下真的能过。
# 若将来出现某个工具链环节在非 ASCII 路径下失败，退回方案是：工程目录改回纯 ASCII，
# 工作区其余目录保持中文编号。
android.overridePathCheck=true
